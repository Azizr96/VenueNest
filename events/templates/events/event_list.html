{% extends "events/base.html" %}

{% block content %}
<h1>Events</h1>

<div class="row">
    {% for event in events %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">{{ event.title }}</h2>
                    <p>{{ event.date }} at {{ event.start_time }}</p>
                    <p>{{ event.location }}</p>
                    <a class="btn btn-primary" href="{% url 'event_detail' event.pk %}">
                        View Details
                    </a>
                </div>
            </div>
        </div>
    {% empty %}
        <p>No events available.</p>
    {% endfor %}
</div>
{% endblock %}
