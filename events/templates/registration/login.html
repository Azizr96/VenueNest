{% extends "events/base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h1>Login</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Login
            </button>
        </form>

        <p class="mt-3">
            Need an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>
</div>

{% endblock %}
